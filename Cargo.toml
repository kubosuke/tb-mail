[package]
name = "tb-mail"
version = "0.1.0"
edition = "2021"
description = "Read/list local Thunderbird mbox mail (for automation and AI agents)"

[[bin]]
name = "tb-mail"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mail-parser = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
